<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1a2b">
<meta name="description" content="Ubah file lari .GPX / .TCX jadi video animasi 9:16 dengan mode tanding 1 vs 1, langsung di browser.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JejakKita | Video Animasi Lari 9:16</title>
<style>
:root{--bg:#0f1a2b;--pan:#16243b;--line:#243754;--ink:#f2f5f7;--mute:#8da0bb;--a:#ff5a1f;--b:#3ddc97;
font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:1000px;margin:auto}
h1{font-size:22px;margin:0;letter-spacing:-.5px;font-weight:800}
h1 i{color:var(--a);font-style:normal}
main{display:grid;gap:18px;max-width:1000px;margin:auto;padding:0 18px 28px;grid-template-columns:minmax(0,360px) 1fr}
@media(max-width:760px){main{grid-template-columns:1fr}}
canvas{width:100%;aspect-ratio:9/16;max-height:72vh;border-radius:18px;background:#0f1a2b;border:1px solid var(--line);display:block;margin:auto}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;align-self:start}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px}
button,select,input{font:inherit;color:inherit}
.seg button{background:none;border:0;padding:10px;border-radius:9px;font-weight:700;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--a);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-left:5px solid var(--c);padding-left:10px}
.row input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.row select{padding:10px;border-radius:10px}
.file{background:var(--bg);border:1px dashed var(--mute);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.file.ok{border-style:solid;border-color:var(--c);color:var(--c)}
.file input{display:none}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.ctl>*{flex:1}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.hot{background:var(--a);color:#fff}
select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
button:focus-visible,select:focus-visible,input:focus-visible,.file:focus-within{outline:2px solid var(--b);outline-offset:2px}
#msg{margin:0;color:var(--mute);font-size:14px;min-height:20px}
small{color:var(--mute);line-height:1.5}
</style>
</head>
<body>
<header><h1>Jejak<i>Kita</i></h1><button id="inst" class="btn ghost" hidden>Pasang aplikasi</button></header>
<main>
<canvas id="cv" aria-label="Pratinjau video lari"></canvas>
<section class="panel">
 <div class="seg"><button data-m="solo" class="on">Solo</button><button data-m="vs">Tanding 1 vs 1</button></div>
 <div class="row" style="--c:var(--a)"><input type="text" id="nA" value="Aku" aria-label="Nama pelari A"><select class="ch" aria-label="Karakter A"><option value="cap">Chibi</option><option value="cat">Kucing</option><option value="robot">Robot</option><option value="panda">Panda</option></select><label class="file" id="fA">Pilih file<input type="file" accept=".gpx,.tcx"></label></div>
 <div class="row" id="rB" style="--c:var(--b)" hidden><input type="text" id="nB" value="Rival" aria-label="Nama pelari B"><select class="ch" aria-label="Karakter B"><option value="cap">Chibi</option><option value="cat">Kucing</option><option value="robot">Robot</option><option value="panda">Panda</option></select><label class="file" id="fB">Pilih file<input type="file" accept=".gpx,.tcx"></label></div>
 <div class="ctl"><select id="dur" aria-label="Durasi video"><option value="10">10 detik</option><option value="15" selected>15 detik</option><option value="25">25 detik</option></select><button class="btn" id="play">Putar</button></div>
 <button class="btn hot" id="exp">Unduh video 9:16</button>
 <button class="btn ghost" id="demo">Coba data contoh</button>
 <p id="msg" role="status"></p>
 <small>Ekspor aktivitas dari Strava, Garmin, Coros, dll. sebagai .GPX atau .TCX. Semua diproses di perangkatmu, tidak ada yang diunggah.</small>
</section>
</main>
<script>
const $=s=>document.querySelector(s),C=$('#cv'),x=C.getContext('2d'),W=540,H=960;
C.width=W;C.height=H;
const R=[{name:'Aku',col:'#ff5a1f',ch:'cap',trk:null},{name:'Rival',col:'#3ddc97',ch:'cap',trk:null}];
let mode='solo',raf=0;
const act=()=>mode=='vs'?R:[R[0]],ready=()=>act().every(r=>r.trk);
const msg=t=>$('#msg').textContent=t;
const hav=(a,b)=>{const r=Math.PI/180,p=(b.lat-a.lat)*r,q=(b.lon-a.lon)*r,h=Math.sin(p/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(q/2)**2;return 12742000*Math.asin(Math.sqrt(h))};

function finalize(pts,pace=360){
  if(pts.length<2)throw new Error('Titik rute kurang dari 2');
  let d=0;pts[0].d=0;
  for(let i=1;i<pts.length;i++){d+=hav(pts[i-1],pts[i]);pts[i].d=d}
  const ok=pts.every(p=>!isNaN(p.t));
  pts.forEach(p=>p.s=ok?(p.t-pts[0].t)/1000:p.d*pace/1000);
  return{pts,dur:pts[pts.length-1].s||1,dist:d}
}
function parse(txt){
  const doc=new DOMParser().parseFromString(txt,'text/xml'),pts=[],tm=n=>{const e=n.querySelector('time,Time');return e?Date.parse(e.textContent):NaN};
  doc.querySelectorAll('trkpt').forEach(n=>pts.push({lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),t:tm(n)}));
  if(!pts.length)doc.querySelectorAll('Trackpoint').forEach(n=>{const a=n.querySelector('LatitudeDegrees'),o=n.querySelector('LongitudeDegrees');if(a&&o)pts.push({lat:+a.textContent,lon:+o.textContent,t:tm(n)})});
  return finalize(pts)
}
function demoTrack(seed,pace){
  const pts=[];
  for(let i=0;i<=320;i++){const a=i/320*6.2832,r=.0045*(1+.25*Math.sin(3*a+seed)+.12*Math.cos(5*a));
    pts.push({lat:-6.1754+r*Math.sin(a)*.8,lon:106.8272+r*Math.cos(a),t:NaN})}
  return finalize(pts,pace)
}
function layout(){
  const L=act().filter(r=>r.trk);if(!L.length)return;
  const all=L.flatMap(r=>r.trk.pts),lat0=all.reduce((s,p)=>s+p.lat,0)/all.length,k=Math.cos(lat0*Math.PI/180);
  let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  all.forEach(p=>{p.u=p.lon*k;p.v=-p.lat;mnx=Math.min(mnx,p.u);mxx=Math.max(mxx,p.u);mny=Math.min(mny,p.v);mxy=Math.max(mxy,p.v)});
  const w=mxx-mnx||1e-6,h=mxy-mny||1e-6,sc=Math.min(420/w,520/h),ox=270-(w*sc)/2,oy=440-(h*sc)/2;
  all.forEach(p=>{p.x=ox+(p.u-mnx)*sc;p.y=oy+(p.v-mny)*sc})
}
function at(t,s){
  const P=t.pts,n=P.length,L=P[n-1];
  if(s<=0)return{i:0,x:P[0].x,y:P[0].y,d:0,s:0};
  if(s>=L.s)return{i:n-1,x:L.x,y:L.y,d:L.d,s:L.s,fin:1};
  let lo=0,hi=n-1;while(hi-lo>1){const m=lo+hi>>1;P[m].s<=s?lo=m:hi=m}
  const a=P[lo],b=P[hi],f=(s-a.s)/((b.s-a.s)||1);
  return{i:lo,x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,d:a.d+(b.d-a.d)*f,s}
}
const fmt=s=>{s=Math.round(s);const h=s/3600|0,m=(s%3600)/60|0,c=s%60,z=n=>String(n).padStart(2,'0');return(h?h+':'+z(m):m)+':'+z(c)};
const pace=(s,d)=>d<30?'--:--':fmt(s/(d/1000));

function bg(){
  x.fillStyle='#0f1a2b';x.fillRect(0,0,W,H);
  x.save();x.translate(W/2,H/2);x.rotate(-.35);x.strokeStyle='#15233a';x.lineWidth=14;
  for(let i=-900;i<900;i+=110){x.beginPath();x.moveTo(i,-900);x.lineTo(i,900);x.stroke();x.beginPath();x.moveTo(-900,i*.9);x.lineTo(900,i*.9);x.stroke()}
  x.restore()
}
function line(P,to,w,c,end){
  x.beginPath();x.moveTo(P[0].x,P[0].y);
  for(let i=1;i<=to;i++)x.lineTo(P[i].x,P[i].y);
  if(end)x.lineTo(end.x,end.y);
  x.lineWidth=w;x.strokeStyle=c;x.lineCap=x.lineJoin='round';x.stroke()
}
function head(ch,col){
  const eye=(a,b,r=2,c='#0f1a2b')=>{x.fillStyle=c;x.beginPath();x.arc(a,b,r,0,7);x.fill()};
  if(ch=='cat'){
    x.fillStyle=col;[-1,1].forEach(m=>{x.beginPath();x.moveTo(m*5,-30);x.lineTo(m*14,-44);x.lineTo(m*14,-24);x.fill()});
    x.fillStyle='#ffd2a0';x.beginPath();x.arc(0,-19,14,0,7);x.fill();
    eye(5,-19);eye(-4,-19);eye(1,-14,1.5,'#e0457b');
    x.strokeStyle='#0f1a2b';x.lineWidth=1.4;x.beginPath();x.moveTo(8,-14);x.lineTo(19,-16);x.moveTo(8,-12);x.lineTo(19,-11);x.stroke()
  }else if(ch=='robot'){
    x.strokeStyle='#c8d3e3';x.lineWidth=3;x.beginPath();x.moveTo(0,-31);x.lineTo(0,-40);x.stroke();eye(0,-41,3.5,col);
    x.fillStyle='#c8d3e3';x.beginPath();x.roundRect(-14,-32,28,24,7);x.fill();
    x.fillStyle='#0f1a2b';x.beginPath();x.roundRect(-10,-26,20,10,4);x.fill();
    eye(-4,-21,2.6,col);eye(4,-21,2.6,col)
  }else if(ch=='panda'){
    eye(-11,-32,6,'#14181f');eye(11,-32,6,'#14181f');
    x.fillStyle='#fff';x.beginPath();x.arc(0,-19,14,0,7);x.fill();
    x.fillStyle='#14181f';x.beginPath();x.ellipse(-5,-19,4,5,.3,0,7);x.ellipse(5,-19,4,5,-.3,0,7);x.fill();
    eye(-5,-19,1.6,'#fff');eye(5,-19,1.6,'#fff');eye(0,-13,1.8,'#14181f')
  }else{
    x.fillStyle='#ffd9b8';x.beginPath();x.arc(0,-19,14,0,7);x.fill();
    x.fillStyle=col;x.beginPath();x.arc(0,-22,14,Math.PI,0);x.fill();x.fillRect(2,-23,18,4);
    eye(5,-17);eye(-3,-17)
  }
}
function chibi(px,py,col,ph,nm,ch){
  x.save();x.translate(px,py-28);
  x.fillStyle='#0006';x.beginPath();x.ellipse(0,28,14,5,0,0,7);x.fill();
  const sw=Math.sin(ph)*10;x.lineCap='round';
  x.strokeStyle='#f2f5f7';x.lineWidth=5;x.beginPath();x.moveTo(0,10);x.lineTo(sw,27);x.moveTo(0,10);x.lineTo(-sw,27);x.stroke();
  x.fillStyle=col;x.beginPath();x.roundRect(-9,-6,18,19,7);x.fill();
  x.strokeStyle=col;x.lineWidth=4;x.beginPath();x.moveTo(0,-1);x.lineTo(-sw*.8,9);x.moveTo(0,-1);x.lineTo(sw*.8,9);x.stroke();
  head(ch,col);
  x.font='700 15px system-ui';x.textAlign='center';x.fillStyle='#f2f5f7';x.strokeStyle='#0f1a2b';x.lineWidth=4;
  x.strokeText(nm,0,-46);x.fillText(nm,0,-46);
  x.restore()
}
function empty(){
  x.fillStyle='#f2f5f7';x.textAlign='center';x.font='800 34px system-ui';
  x.fillText('Belum ada rute',W/2,H/2-10);
  x.fillStyle='#8da0bb';x.font='500 20px system-ui';
  x.fillText('Pilih file .GPX / .TCX atau coba data contoh',W/2,H/2+28)
}
function frame(prog){
  bg();
  const A=act();if(!ready()){empty();return}
  const maxS=Math.max(...A.map(r=>r.trk.dur)),k=Math.min(prog/.88,1),S=k*maxS;
  const st=A.map(r=>({r,...at(r.trk,S)}));
  A.forEach(r=>{line(r.trk.pts,r.trk.pts.length-1,16,'#1d2f4b')});
  st.forEach(o=>line(o.r.trk.pts,o.i,7,o.r.col,o));
  st.slice().sort((a,b)=>a.y-b.y).forEach(o=>chibi(o.x,o.y,o.r.col,o.d/3.2,o.r.name,o.r.ch));
  // header
  x.textAlign='left';x.fillStyle='#8da0bb';x.font='700 20px system-ui';x.fillText('JejakKita',40,64);
  x.fillStyle='#f2f5f7';
  if(mode=='solo'){
    const dv=(st[0].d/1000).toFixed(2);
    x.font='800 92px system-ui';x.fillText(dv,38,160);const tw=x.measureText(dv).width;
    x.font='700 28px system-ui';x.fillStyle='#8da0bb';x.fillText('km',38+tw+10,160)
  }else{
    const [a,b]=st,fin=k>=1,lead=a.d>=b.d?a:b,gap=Math.abs(a.d-b.d);
    x.font='800 54px system-ui';
    let t;
    if(fin){const w=R[0].trk.dur<=R[1].trk.dur?R[0]:R[1];t=w.name+' menang';x.fillStyle=w.col}
    else{t=gap<5?'Seri':lead.r.name+' unggul '+Math.round(gap)+' m';x.fillStyle=gap<5?'#f2f5f7':lead.r.col}
    x.fillText(t,40,142);
    x.font='600 22px system-ui';x.fillStyle='#8da0bb';
    x.fillText(fin?'Selisih waktu '+fmt(Math.abs(R[0].trk.dur-R[1].trk.dur)):'Tanding 1 vs 1',40,182)
  }
  // cards
  const n=st.length,g=14,cw=(W-80-g*(n-1))/n;
  st.forEach((o,i)=>{
    const cx=40+i*(cw+g),cy=770;
    x.fillStyle='#16243b';x.beginPath();x.roundRect(cx,cy,cw,150,14);x.fill();
    x.fillStyle=o.r.col;x.fillRect(cx,cy+16,5,118);
    x.textAlign='left';x.fillStyle='#8da0bb';x.font='700 18px system-ui';x.fillText(o.r.name,cx+20,cy+34);
    x.fillStyle='#f2f5f7';x.font='800 '+(n>1?30:42)+'px system-ui';x.fillText((o.d/1000).toFixed(2)+' km',cx+20,cy+78);
    x.font='600 '+(n>1?19:22)+'px system-ui';x.fillStyle='#c8d3e3';
    x.fillText(fmt(o.s)+'  ·  '+pace(o.s,o.d)+' /km',cx+20,cy+112)
  })
}
function play(done){
  if(!ready()){msg('Muat file rute dulu.');return}
  cancelAnimationFrame(raf);msg('');
  const D=+$('#dur').value*1000,t0=performance.now();
  const tick=n=>{const p=Math.min((n-t0)/D,1);frame(p);if(p<1)raf=requestAnimationFrame(tick);else done&&done()};
  raf=requestAnimationFrame(tick)
}
function exportVideo(){
  if(!ready()){msg('Muat file rute dulu.');return}
  if(!window.MediaRecorder){msg('Browser ini belum mendukung perekaman video.');return}
  const mt=['video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const rec=new MediaRecorder(C.captureStream(30),{mimeType:mt,videoBitsPerSecond:6e6}),ch=[];
  rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:mt}));a.download='jejakkita.'+(mt.includes('mp4')?'mp4':'webm');a.click();msg('Video selesai diunduh.')};
  msg('Merekam video...');rec.start();play(()=>setTimeout(()=>rec.stop(),600))
}
function refresh(){cancelAnimationFrame(raf);layout();frame(1)}
function load(i,file){
  const r=new FileReader();
  r.onload=()=>{try{R[i].trk=parse(r.result);$(i?'#fB':'#fA').firstChild.textContent=(R[i].trk.dist/1000).toFixed(2)+' km ✓';$(i?'#fB':'#fA').classList.add('ok');msg('');refresh()}
    catch(e){msg('File tidak terbaca. Pakai .GPX atau .TCX yang berisi titik rute.')}};
  r.readAsText(file)
}
document.querySelectorAll('.file input').forEach((el,i)=>el.onchange=()=>el.files[0]&&load(i,el.files[0]));
document.querySelectorAll('.ch').forEach((el,i)=>el.onchange=()=>{R[i].ch=el.value;frame(1)});
$('#nA').oninput=e=>{R[0].name=e.target.value||'A';frame(1)};
$('#nB').oninput=e=>{R[1].name=e.target.value||'B';frame(1)};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll('.seg button').forEach(o=>o.classList.toggle('on',o==b));
  $('#rB').hidden=mode=='solo';refresh()
});
$('#play').onclick=()=>play();$('#exp').onclick=exportVideo;
$('#demo').onclick=()=>{
  R[0].trk=demoTrack(0,330);R[1].trk=demoTrack(0,312);
  ['#fA','#fB'].forEach((s,i)=>{$(s).firstChild.textContent=(R[i].trk.dist/1000).toFixed(2)+' km ✓';$(s).classList.add('ok')});
  refresh();play()
};
refresh();
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('#inst').hidden=true}};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
