<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9">
<meta name="description" content="Ubah file lari .GPX / .TCX jadi video animasi 9:16 dengan mode tanding 1 vs 1, langsung di browser.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kuy Lari | Video Animasi Lari 9:16</title>
<style>
:root{--bg:#f3f5f9;--pan:#fff;--line:#e2e7ef;--ink:#0f1a2b;--mute:#6b7a90;--a:#ff5a1f;--b:#1fb37a;--navy:#0f1a2b;font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:1000px;margin:auto}
h1{font-size:22px;margin:0;letter-spacing:-.5px;font-weight:800}
h1 i{color:var(--a);font-style:normal}
main{display:grid;gap:18px;max-width:1000px;margin:auto;padding:0 18px 28px;grid-template-columns:minmax(0,360px) minmax(0,1fr)}
@media(max-width:760px){main{grid-template-columns:1fr}}
canvas{width:100%;aspect-ratio:9/16;max-height:72vh;border-radius:18px;background:#0f1a2b;display:block;margin:auto}
.panel{display:flex;flex-direction:column;gap:12px;align-self:start;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.st small{display:block;color:var(--mute);font-size:11px}
.st b{display:block;font-size:17px;margin-top:2px;white-space:nowrap}
.st span{font-size:12px;color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#e6ebf3;border-radius:14px;padding:4px}
.tabs button{background:none;border:0;padding:10px 2px;border-radius:11px;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0f1a2b26}
.pane{display:none;background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:14px;flex-direction:column;gap:12px}
.pane.on{display:flex}
h3{margin:6px 0 0;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.g2,.g4{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
button,select,input{font:inherit;color:inherit}
.opt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:14px}.opt span{font-size:12px;color:var(--mute)}
.opt.on{background:var(--navy);border-color:var(--navy);color:#fff}.opt.on span{color:#b9c6da}
.opt.g.on{background:#e8faf2;border:2px solid var(--b);color:var(--ink)}.opt.g.on span{color:var(--mute)}
.g4 .opt{align-items:center;text-align:center;font-weight:700;font-size:14px;padding:12px 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-left:5px solid var(--c);padding-left:10px}
.row input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.row select{padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.file{background:var(--bg);border:1px dashed var(--mute);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.file.ok{border-style:solid;border-color:var(--c);color:var(--c)}
.file input{display:none}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.ctl>*{flex:1}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.hot{background:var(--a);color:#fff}
.ctl select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
button:focus-visible,select:focus-visible,input:focus-visible,.file:focus-within{outline:2px solid var(--b);outline-offset:2px}
#msg{margin:0;color:var(--mute);font-size:14px;min-height:20px}
small.n,.hint{color:var(--mute);line-height:1.5;font-size:13px;margin:0}
</style>
</head>
<body>
<header><h1>Kuy <i>Lari</i></h1><button id="inst" class="btn ghost" hidden>Pasang aplikasi</button></header>
<main>
<canvas id="cv" aria-label="Pratinjau video lari"></canvas>
<section class="panel">
 <div class="stats">
  <div class="st"><small>Jarak &amp; Waktu</small><b id="s1">--</b><span id="s1b">--</span></div>
  <div class="st"><small>Avg Pace &amp; HR</small><b id="s2">--</b><span id="s2b">--</span></div>
  <div class="st"><small>Cadence &amp; Elev</small><b id="s3">--</b><span id="s3b">--</span></div>
 </div>
 <div class="tabs"><button data-t="pelari" class="on">🏃 Pelari</button><button data-t="tanding">⚔️ Tanding</button><button data-t="peta">🗺️ Peta</button><button data-t="export">🎬 Export</button></div>
 <div class="pane on" data-p="pelari">
  <div class="row" style="--c:var(--a)"><input type="text" id="nA" value="Aku" aria-label="Nama pelari A"><select class="ch" aria-label="Karakter A"><option value="boy">Cowok</option><option value="girl">Cewek</option><option value="cap">Chibi</option><option value="cat">Kucing</option><option value="robot">Robot</option><option value="panda">Panda</option></select><label class="file" id="fA">Pilih file<input type="file" accept=".gpx,.tcx"></label></div>
  <div class="row" id="rB" style="--c:var(--b)" hidden><input type="text" id="nB" value="Rival" aria-label="Nama pelari B"><select class="ch" aria-label="Karakter B"><option value="boy">Cowok</option><option value="girl" selected>Cewek</option><option value="cap">Chibi</option><option value="cat">Kucing</option><option value="robot">Robot</option><option value="panda">Panda</option></select><label class="file" id="fB">Pilih file<input type="file" accept=".gpx,.tcx"></label></div>
  <p class="hint">Ekspor aktivitas dari Strava, Garmin, Coros, dll. sebagai .GPX atau .TCX. File diproses di perangkatmu.</p>
 </div>
 <div class="pane" data-p="tanding">
  <div class="g2"><button class="opt" data-k="mode" data-v="solo"><b>Solo</b><span>Satu pelari</span></button><button class="opt" data-k="mode" data-v="vs"><b>Tanding 1 vs 1</b><span>Adu dua rute</span></button></div>
  <p class="hint">Untuk tanding, isi file pelari kedua di tab Pelari.</p>
  <button class="btn ghost" id="demo">Coba data contoh</button>
 </div>
 <div class="pane" data-p="peta">
  <h3>Sudut kamera 3D</h3>
  <div class="g2"><button class="opt" data-k="cam" data-v="drone"><b>Drone View</b><span>Aerial 65° ikuti pelari</span></button><button class="opt" data-k="cam" data-v="over"><b>Overview Map</b><span>Lihat seluruh area rute</span></button></div>
  <h3>Gaya peta nyata</h3>
  <div class="g2">
   <button class="opt g" data-k="map" data-v="topo"><b>Peta Topo</b><span>Kontur, bukit &amp; hutan</span></button>
   <button class="opt g" data-k="map" data-v="sat"><b>Satelit + Label</b><span>Citra udara asli</span></button>
  </div>
  <h3>Pencahayaan &amp; suasana</h3>
  <div class="g4"><button class="opt" data-k="lt" data-v="auto">Auto</button><button class="opt" data-k="lt" data-v="pagi">Pagi</button><button class="opt" data-k="lt" data-v="sore">Sore</button><button class="opt" data-k="lt" data-v="malam">Malam</button></div>
  <div class="chips"><button class="chip" data-pre="park">City Park</button><button class="chip" data-pre="mount">Mountain</button><button class="chip" data-pre="night">Night Run</button></div>
 </div>
 <div class="pane" data-p="export">
  <div class="ctl"><select id="dur" aria-label="Durasi video"><option value="10">10 detik</option><option value="15" selected>15 detik</option><option value="25">25 detik</option></select><button class="btn" id="play">Putar</button></div>
  <button class="btn hot" id="exp">Rekam video 9:16</button>
  <div id="res" hidden><video id="pv" controls playsinline loop muted style="width:100%;max-height:50vh;border-radius:14px;background:#000"></video>
   <div class="ctl" style="margin-top:8px"><button class="btn hot" id="shr">Bagikan (IG, WhatsApp)</button><button class="btn ghost" id="sav">Simpan video</button></div>
   <p class="hint" id="rh"></p></div>
 </div>
 <p id="msg" role="status"></p>
</section>
</main>
<script>
const $=s=>document.querySelector(s),C=$('#cv'),x=C.getContext('2d'),W=540,H=960;
C.width=W;C.height=H;
const R=[{name:'Aku',col:'#ff5a1f',ch:'boy',trk:null},{name:'Rival',col:'#3ddc97',ch:'girl',trk:null}];
let mode='solo',raf=0;
const act=()=>mode=='vs'?R:[R[0]],ready=()=>act().every(r=>r.trk);
const msg=t=>$('#msg').textContent=t;
const hav=(a,b)=>{const r=Math.PI/180,p=(b.lat-a.lat)*r,q=(b.lon-a.lon)*r,h=Math.sin(p/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(q/2)**2;return 12742000*Math.asin(Math.sqrt(h))};

function finalize(pts,pace=360){
  if(pts.length<2)throw new Error('Titik rute kurang dari 2');
  let d=0,g=0;pts[0].d=0;
  for(let i=1;i<pts.length;i++){d+=hav(pts[i-1],pts[i]);pts[i].d=d;const e=pts[i].ele-pts[i-1].ele;if(e>.5)g+=e}
  const ok=pts.every(p=>!isNaN(p.t)),av=k=>{const v=pts.map(p=>p[k]).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b)/v.length:NaN};
  pts.forEach(p=>{p.s=ok?(p.t-pts[0].t)/1000:p.d*pace/1000;const r=p.lat*Math.PI/180;p.x=(p.lon+180)/360;p.y=.5-Math.log(Math.tan(Math.PI/4+r/2))/(2*Math.PI)});
  let cad=av('cad');if(cad<120)cad*=2;
  return{pts,dur:pts[pts.length-1].s||1,dist:d,hr:av('hr'),cad,gain:g,t0:pts[0].t}
}
function parse(txt){
  const doc=new DOMParser().parseFromString(txt,'text/xml'),pts=[],
  q=(n,s)=>{const e=n.querySelector(s);return e?+e.textContent:NaN},
  tm=n=>{const e=n.querySelector('time,Time');return e?Date.parse(e.textContent):NaN};
  doc.querySelectorAll('trkpt').forEach(n=>pts.push({lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),t:tm(n),ele:q(n,'ele'),hr:q(n,'hr'),cad:q(n,'cad')}));
  if(!pts.length)doc.querySelectorAll('Trackpoint').forEach(n=>{const a=n.querySelector('LatitudeDegrees'),o=n.querySelector('LongitudeDegrees');if(a&&o)pts.push({lat:+a.textContent,lon:+o.textContent,t:tm(n),ele:q(n,'AltitudeMeters'),hr:q(n,'HeartRateBpm>Value'),cad:q(n,'RunCadence,Cadence')})});
  return finalize(pts)
}
function demoTrack(seed,pace){
  const pts=[];
  for(let i=0;i<=320;i++){const a=i/320*6.2832,r=.0045*(1+.25*Math.sin(3*a+seed)+.12*Math.cos(5*a));
    pts.push({lat:-6.1754+r*Math.sin(a)*.8,lon:106.8272+r*Math.cos(a),t:NaN,ele:12+9*Math.sin(a*2),hr:152+10*Math.sin(a),cad:87})}
  return finalize(pts,pace)
}
function layout(){
  const L=act().filter(r=>r.trk);if(!L.length){V=null;return}
  let a=1e9,b=-1e9,c=1e9,e=-1e9;
  L.forEach(r=>r.trk.pts.forEach(p=>{a=Math.min(a,p.x);b=Math.max(b,p.x);c=Math.min(c,p.y);e=Math.max(e,p.y)}));
  V={cx:(a+b)/2,cy:(c+e)/2,S:Math.min(420/((b-a)||1e-7),520/((e-c)||1e-7),256*2**17)}
}
function at(t,s){
  const P=t.pts,n=P.length,L=P[n-1];
  if(s<=0)return{i:0,x:P[0].x,y:P[0].y,d:0,s:0};
  if(s>=L.s)return{i:n-1,x:L.x,y:L.y,d:L.d,s:L.s,fin:1};
  let lo=0,hi=n-1;while(hi-lo>1){const m=lo+hi>>1;P[m].s<=s?lo=m:hi=m}
  const a=P[lo],b=P[hi],f=(s-a.s)/((b.s-a.s)||1);
  return{i:lo,x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,d:a.d+(b.d-a.d)*f,s}
}
const fmt=s=>{s=Math.round(s);const h=s/3600|0,m=(s%3600)/60|0,c=s%60,z=n=>String(n).padStart(2,'0');return(h?h+':'+z(m):m)+':'+z(c)};
const pace=(s,d)=>d<30?'--:--':fmt(s/(d/1000));

let M={cam:'drone',map:'topo',lt:'auto'},lastP=1,CM=null,V=null,playing=0,rq=0;
const OW=1240,OH=1000,O=document.createElement('canvas'),Y0=250,SN=OH/2+330,SF=OH/2-480;
O.width=OW;O.height=OH;const XO=O.getContext('2d');
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/',
MAPS={topo:[ESRI+'World_Topo_Map/MapServer/tile/{z}/{y}/{x}'],
 sat:[ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}',ESRI+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}']},
ATT={topo:'© Esri, USGS, NOAA',sat:'© Esri, Maxar, Earthstar'},
LT={pagi:{sky:['#7fc2ff','#e3f3ff'],ov:'#fff8e61a'},sore:{sky:['#ff7e47','#ffd9a3'],ov:'#ff8c3a40'},malam:{sky:['#040813','#16294d'],ov:'#0a144673'}},
BASE={topo:'#e8e4d8',sat:'#1d2a22'},TL={};
const redraw=()=>{if(playing||rq)return;rq=requestAnimationFrame(()=>{rq=0;frame(lastP)})};
function light(){
  let k=M.lt;
  if(k=='auto'){const t=R[0].trk&&R[0].trk.t0,h=t==t?new Date(t).getHours():8;k=h>=15&&h<18?'sore':(h>=18||h<5)?'malam':'pagi'}
  return LT[k]
}
function tile(u){let i=TL[u];if(!i){i=TL[u]=new Image();i.crossOrigin='anonymous';i.onload=()=>{i.ok=1;redraw()};i.src=u}return i}
function base(L){
  XO.fillStyle=BASE[M.map];XO.fillRect(0,0,OW,OH);
  XO.strokeStyle='#8883';XO.lineWidth=1;
  for(let i=0;i<OW;i+=80){XO.beginPath();XO.moveTo(i,0);XO.lineTo(i,OH);XO.stroke()}
  for(let i=0;i<OH;i+=80){XO.beginPath();XO.moveTo(0,i);XO.lineTo(OW,i);XO.stroke()}
  const z=Math.min(17,Math.max(1,Math.round(Math.log2(CM.S/256)))),n=2**z,ts=CM.S/n,
  tx0=Math.floor((CM.cx-OW/2/CM.S)*n),tx1=Math.floor((CM.cx+OW/2/CM.S)*n),
  ty0=Math.max(0,Math.floor((CM.cy-OH/2/CM.S)*n)),ty1=Math.min(n-1,Math.floor((CM.cy+OH/2/CM.S)*n));
  MAPS[M.map].forEach(u=>{for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    const im=tile(u.replace('{z}',z).replace('{x}',(tx%n+n)%n).replace('{y}',ty));
    if(im.ok)XO.drawImage(im,OW/2+(tx/n-CM.cx)*CM.S,OH/2+(ty/n-CM.cy)*CM.S,ts+1,ts+1)}});
  XO.fillStyle=L.ov;XO.fillRect(0,0,OW,OH)
}
function camera(st){
  let{cx,cy,S}=V;
  if(M.cam=='drone'){const L=st.reduce((a,b)=>b.d>a.d?b:a);cx+=(L.x-cx)*.6;cy+=(L.y-cy)*.6;S*=1.4}
  return{cx,cy,S}
}
function line(P,to,w,col,end){
  const fx=p=>OW/2+(p.x-CM.cx)*CM.S,fy=p=>OH/2+(p.y-CM.cy)*CM.S;
  XO.beginPath();XO.moveTo(fx(P[0]),fy(P[0]));
  for(let i=1;i<=to;i++)XO.lineTo(fx(P[i]),fy(P[i]));
  if(end)XO.lineTo(fx(end),fy(end));
  XO.lineWidth=w;XO.strokeStyle=col;XO.lineCap=XO.lineJoin='round';XO.stroke()
}
function F(px,py){
  const fx=OW/2+(px-CM.cx)*CM.S,fy=OH/2+(py-CM.cy)*CM.S;
  if(M.cam!='drone')return{x:W/2+fx-OW/2,y:470+fy-OH/2,s:1};
  const d=Math.max(-.3,Math.min(1,(SN-fy)/(SN-SF))),u=d/(.45+.55*d);
  return{x:W/2+(fx-OW/2)*(1-.55*u),y:H-u*(H-Y0),s:1-.55*u}
}
function compose(L){
  if(M.cam!='drone'){x.drawImage(O,W/2-OW/2,470-OH/2);return}
  const g=x.createLinearGradient(0,0,0,Y0);g.addColorStop(0,L.sky[0]);g.addColorStop(1,L.sky[1]);x.fillStyle=g;x.fillRect(0,0,W,Y0+2);
  for(let y=Y0;y<H;y++){const u=(H-y)/(H-Y0),s=1-.55*u,sy=SN-(SN-SF)*(.45*u/(1-.55*u));x.drawImage(O,OW/2-W/(2*s),sy,W/s,2,0,y,W,1)}
  const h=x.createLinearGradient(0,Y0,0,Y0+110);h.addColorStop(0,L.sky[1]);h.addColorStop(1,L.sky[1]+'00');x.fillStyle=h;x.fillRect(0,Y0,W,110)
}
function stats(){
  const t=R[0].trk,e=(a,b,c)=>{$('#s'+a).textContent=b;$('#s'+a+'b').textContent=c};
  if(!t){e(1,'--','--');e(2,'--','--');e(3,'--','--');return}
  const q=Math.round(t.dur/(t.dist/1000)),ok=Number.isFinite;
  e(1,(t.dist/1000).toFixed(2)+' km',fmt(t.dur));
  e(2,(q/60|0)+"'"+String(q%60).padStart(2,'0')+'"/km',ok(t.hr)?Math.round(t.hr)+' bpm':'-- bpm');
  e(3,ok(t.cad)?Math.round(t.cad)+' spm':'-- spm',t.gain>0?'+'+Math.round(t.gain)+' m':'-- m')
}
function sync(){
  const cur={mode,cam:M.cam,map:M.map,lt:M.lt};
  document.querySelectorAll('.opt[data-k]').forEach(b=>b.classList.toggle('on',cur[b.dataset.k]==b.dataset.v))
}
function head(ch,col,ph){
  const eye=(a,b,r=2,c='#0f1a2b')=>{x.fillStyle=c;x.beginPath();x.arc(a,b,r,0,7);x.fill()};
  if(ch=='boy'||ch=='girl'){
    const g=ch=='girl',hair=g?'#6b4030':'#2b2f3a',sw=Math.sin(ph);
    if(g){
      x.fillStyle=hair;x.beginPath();x.ellipse(-17,-17+sw*3,5,11,.5+sw*.3,0,7);x.fill();
      x.fillStyle=col;x.beginPath();x.moveTo(-9,7);x.lineTo(9,7);x.lineTo(14,18);x.lineTo(-14,18);x.fill()
    }
    x.fillStyle='#ffdcc0';x.beginPath();x.arc(0,-20,16,0,7);x.fill();
    x.fillStyle=hair;x.beginPath();x.arc(0,-23,16,Math.PI,0);x.fill();
    if(g){x.fillStyle=hair;x.beginPath();x.ellipse(5,-30,12,4.5,.15,0,Math.PI);x.fill();
      x.fillStyle=col;[[-1,1],[1,1]].forEach(m=>{x.beginPath();x.moveTo(-10,-37);x.lineTo(-10+m[0]*9,-43);x.lineTo(-10+m[0]*9,-31);x.fill()});eye(-10,-37,2.2,'#fff')}
    else{x.fillStyle=hair;[-9,-1,7].forEach(a=>{x.beginPath();x.moveTo(a-4,-35);x.lineTo(a+1,-46);x.lineTo(a+5,-35);x.fill()});
      x.fillStyle=col;x.fillRect(-14,-28,28,4)}
    eye(7,-18,3.2);eye(-1,-18,3.2);eye(8,-19.2,1.2,'#fff');eye(0,-19.2,1.2,'#fff');
    x.globalAlpha=.65;eye(12,-12.5,2.8,'#ff8fa3');eye(-5,-12.5,2.8,'#ff8fa3');x.globalAlpha=1;
    x.strokeStyle='#0f1a2b';x.lineWidth=1.5;x.lineCap='round';x.beginPath();x.arc(3.5,-13.5,3,.15*Math.PI,.85*Math.PI);x.stroke();
    x.fillStyle='#7cc8ff';x.beginPath();x.moveTo(20,-32);x.quadraticCurveTo(16,-26,20,-24);x.quadraticCurveTo(24,-26,20,-32);x.fill()
  }else if(ch=='cat'){
    x.fillStyle=col;[-1,1].forEach(m=>{x.beginPath();x.moveTo(m*5,-30);x.lineTo(m*14,-44);x.lineTo(m*14,-24);x.fill()});
    x.fillStyle='#ffd2a0';x.beginPath();x.arc(0,-19,14,0,7);x.fill();
    eye(5,-19);eye(-4,-19);eye(1,-14,1.5,'#e0457b');
    x.strokeStyle='#0f1a2b';x.lineWidth=1.4;x.beginPath();x.moveTo(8,-14);x.lineTo(19,-16);x.moveTo(8,-12);x.lineTo(19,-11);x.stroke()
  }else if(ch=='robot'){
    x.strokeStyle='#c8d3e3';x.lineWidth=3;x.beginPath();x.moveTo(0,-31);x.lineTo(0,-40);x.stroke();eye(0,-41,3.5,col);
    x.fillStyle='#c8d3e3';x.beginPath();x.roundRect(-14,-32,28,24,7);x.fill();
    x.fillStyle='#0f1a2b';x.beginPath();x.roundRect(-10,-26,20,10,4);x.fill();
    eye(-4,-21,2.6,col);eye(4,-21,2.6,col)
  }else if(ch=='panda'){
    eye(-11,-32,6,'#14181f');eye(11,-32,6,'#14181f');
    x.fillStyle='#fff';x.beginPath();x.arc(0,-19,14,0,7);x.fill();
    x.fillStyle='#14181f';x.beginPath();x.ellipse(-5,-19,4,5,.3,0,7);x.ellipse(5,-19,4,5,-.3,0,7);x.fill();
    eye(-5,-19,1.6,'#fff');eye(5,-19,1.6,'#fff');eye(0,-13,1.8,'#14181f')
  }else{
    x.fillStyle='#ffd9b8';x.beginPath();x.arc(0,-19,14,0,7);x.fill();
    x.fillStyle=col;x.beginPath();x.arc(0,-22,14,Math.PI,0);x.fill();x.fillRect(2,-23,18,4);
    eye(5,-17);eye(-3,-17)
  }
}
function chibi(px,py,col,ph,nm,ch){
  x.save();x.translate(px,py-28);
  x.fillStyle='#0006';x.beginPath();x.ellipse(0,28,14,5,0,0,7);x.fill();
  const sw=Math.sin(ph)*10;x.lineCap='round';
  x.strokeStyle='#f2f5f7';x.lineWidth=5;x.beginPath();x.moveTo(0,10);x.lineTo(sw,27);x.moveTo(0,10);x.lineTo(-sw,27);x.stroke();
  x.fillStyle=col;x.beginPath();x.roundRect(-9,-6,18,19,7);x.fill();
  x.strokeStyle=col;x.lineWidth=4;x.beginPath();x.moveTo(0,-1);x.lineTo(-sw*.8,9);x.moveTo(0,-1);x.lineTo(sw*.8,9);x.stroke();
  head(ch,col,ph);
  x.font='700 15px system-ui';x.textAlign='center';x.fillStyle='#f2f5f7';x.strokeStyle='#0f1a2b';x.lineWidth=4;
  x.strokeText(nm,0,-56);x.fillText(nm,0,-56);
  x.restore()
}
function empty(){
  x.fillStyle='#f2f5f7';x.textAlign='center';x.font='800 34px system-ui';
  x.fillText('Belum ada rute',W/2,H/2-10);
  x.fillStyle='#8da0bb';x.font='500 20px system-ui';
  x.fillText('Pilih file .GPX / .TCX atau coba data contoh',W/2,H/2+28)
}
function frame(prog){
  lastP=prog;const A=act();
  if(!ready()||!V){x.fillStyle='#0f1a2b';x.fillRect(0,0,W,H);empty();return}
  const maxS=Math.max(...A.map(r=>r.trk.dur)),k=Math.min(prog/.88,1),S=k*maxS;
  const st=A.map(r=>({r,...at(r.trk,S)}));
  CM=camera(st);const L=light();base(L);
  A.forEach(r=>{const P=r.trk.pts;line(P,P.length-1,15,'#ffffffd9');line(P,P.length-1,9,'#243552b3')});
  st.forEach(o=>line(o.r.trk.pts,o.i,9,o.r.col,o));
  compose(L);
  const sc=x.createLinearGradient(0,0,0,240);sc.addColorStop(0,'#08111f99');sc.addColorStop(1,'#08111f00');x.fillStyle=sc;x.fillRect(0,0,W,240);
  st.map(o=>({o,...F(o.x,o.y)})).sort((a,b)=>a.y-b.y).forEach(q=>{x.save();x.translate(q.x,q.y);x.scale(q.s,q.s);chibi(0,0,q.o.r.col,q.o.d/3.2,q.o.r.name,q.o.r.ch);x.restore()});
  x.font='500 11px system-ui';x.textAlign='right';x.fillStyle='#fffc';x.fillText(ATT[M.map],W-40,756);
  x.shadowColor='#000a';x.shadowBlur=10;
  // header
  x.textAlign='left';x.fillStyle='#fff';x.font='700 20px system-ui';x.fillText('Kuy Lari',40,64);
  x.fillStyle='#f2f5f7';
  if(mode=='solo'){
    const dv=(st[0].d/1000).toFixed(2);
    x.font='800 92px system-ui';x.fillText(dv,38,160);const tw=x.measureText(dv).width;
    x.font='700 28px system-ui';x.fillStyle='#e6eefb';x.fillText('km',38+tw+10,160)
  }else{
    const [a,b]=st,fin=k>=1,lead=a.d>=b.d?a:b,gap=Math.abs(a.d-b.d);
    x.font='800 54px system-ui';
    let t;
    if(fin){const w=R[0].trk.dur<=R[1].trk.dur?R[0]:R[1];t=w.name+' menang';x.fillStyle=w.col}
    else{t=gap<5?'Seri':lead.r.name+' unggul '+Math.round(gap)+' m';x.fillStyle=gap<5?'#f2f5f7':lead.r.col}
    x.fillText(t,40,142);
    x.font='600 22px system-ui';x.fillStyle='#e6eefb';
    x.fillText(fin?'Selisih waktu '+fmt(Math.abs(R[0].trk.dur-R[1].trk.dur)):'Tanding 1 vs 1',40,182)
  }
  x.shadowBlur=0;
  // cards
  const n=st.length,g=14,cw=(W-80-g*(n-1))/n;
  st.forEach((o,i)=>{
    const cx=40+i*(cw+g),cy=770;
    x.fillStyle='#16243b';x.beginPath();x.roundRect(cx,cy,cw,150,14);x.fill();
    x.fillStyle=o.r.col;x.fillRect(cx,cy+16,5,118);
    x.textAlign='left';x.fillStyle='#8da0bb';x.font='700 18px system-ui';x.fillText(o.r.name,cx+20,cy+34);
    x.fillStyle='#f2f5f7';x.font='800 '+(n>1?30:42)+'px system-ui';x.fillText((o.d/1000).toFixed(2)+' km',cx+20,cy+78);
    x.font='600 '+(n>1?19:22)+'px system-ui';x.fillStyle='#c8d3e3';
    x.fillText(fmt(o.s)+'  ·  '+pace(o.s,o.d)+' /km',cx+20,cy+112)
  })
}
function play(done){
  if(!ready()){msg('Muat file rute dulu.');return}
  cancelAnimationFrame(raf);msg('');
  const D=+$('#dur').value*1000,t0=performance.now();
  playing=1;const tick=n=>{const p=Math.min((n-t0)/D,1);frame(p);if(p<1)raf=requestAnimationFrame(tick);else{playing=0;done&&done()}};
  raf=requestAnimationFrame(tick)
}
let VF=null;
function exportVideo(){
  if(!ready()){msg('Muat file rute dulu.');return}
  if(!window.MediaRecorder||!C.captureStream){msg('Browser ini belum mendukung perekaman video. Coba Chrome atau Safari terbaru.');return}
  const mt=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  let rec,tk;
  try{rec=new MediaRecorder(C.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:6e6}:{})}
  catch(e){try{rec=new MediaRecorder(C.captureStream(30))}catch(e2){msg('Perekaman gagal dimulai: '+e2.message);return}}
  const ch=[],D=+$('#dur').value;
  rec.ondataavailable=e=>e.data&&e.data.size&&ch.push(e.data);
  rec.onerror=()=>{clearInterval(tk);msg('Perekaman error, coba lagi.')};
  rec.onstop=()=>{
    clearInterval(tk);
    const type=(rec.mimeType||mt||'video/webm').split(';')[0],b=new Blob(ch,{type});
    if(!b.size){msg('Video kosong. Coba lagi dan jangan pindah tab saat merekam.');return}
    const ext=type.includes('mp4')?'mp4':'webm';
    VF=new File([b],'kuylari.'+ext,{type});
    $('#pv').src=URL.createObjectURL(VF);$('#pv').play&&$('#pv').play().catch(()=>{});
    $('#res').hidden=false;
    $('#shr').hidden=!(navigator.canShare&&navigator.canShare({files:[VF]}));
    $('#rh').textContent=ext=='webm'?'Format WebM: Instagram sering menolaknya. Konversi ke MP4 dulu sebelum diunggah.':'Di HP: tekan Bagikan, pilih Instagram, lalu Story.';
    msg('Video siap. Pilih Bagikan atau Simpan.')
  };
  rec.start(500);play(()=>setTimeout(()=>rec.stop(),600));
  let n=D;tk=setInterval(()=>msg('Merekam... '+(--n>0?n:0)+' detik lagi. Jangan pindah tab.'),1000);msg('Merekam... '+D+' detik. Jangan pindah tab.')
}
$('#shr').onclick=async()=>{try{await navigator.share({files:[VF],title:'Kuy Lari'})}catch(e){if(e.name!='AbortError')msg('Gagal membagikan: '+e.message)}};
$('#sav').onclick=()=>{if(!VF)return;const a=document.createElement('a');a.href=URL.createObjectURL(VF);a.download=VF.name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000)};
function refresh(){cancelAnimationFrame(raf);playing=0;layout();stats();sync();frame(1)}
function load(i,file){
  const r=new FileReader();
  r.onload=()=>{try{R[i].trk=parse(r.result);$(i?'#fB':'#fA').firstChild.textContent=(R[i].trk.dist/1000).toFixed(2)+' km ✓';$(i?'#fB':'#fA').classList.add('ok');msg('');refresh()}
    catch(e){msg('File tidak terbaca. Pakai .GPX atau .TCX yang berisi titik rute.')}};
  r.readAsText(file)
}
document.querySelectorAll('.file input').forEach((el,i)=>el.onchange=()=>el.files[0]&&load(i,el.files[0]));
document.querySelectorAll('.ch').forEach((el,i)=>el.onchange=()=>{R[i].ch=el.value;frame(1)});
$('#nA').oninput=e=>{R[0].name=e.target.value||'A';frame(1)};
$('#nB').oninput=e=>{R[1].name=e.target.value||'B';frame(1)};
$('#play').onclick=()=>play();$('#exp').onclick=exportVideo;
$('#demo').onclick=()=>{
  R[0].trk=demoTrack(0,330);R[1].trk=demoTrack(0,312);
  ['#fA','#fB'].forEach((s,i)=>{$(s).firstChild.textContent=(R[i].trk.dist/1000).toFixed(2)+' km ✓';$(s).classList.add('ok')});
  refresh();play()
};
const PRE={park:{map:'sat',lt:'pagi',cam:'drone'},mount:{map:'topo',lt:'pagi',cam:'drone'},night:{map:'topo',lt:'malam',cam:'drone'}};
document.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;if(k=='mode'){mode=v;$('#rB').hidden=v=='solo'}else M[k]=v;refresh()});
document.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{Object.assign(M,PRE[b.dataset.pre]);refresh()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(o=>o.classList.toggle('on',o==b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.p==b.dataset.t))});
refresh();
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('#inst').hidden=true}};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
